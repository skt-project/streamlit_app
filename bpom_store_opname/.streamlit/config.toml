# Pengaturan ringan untuk banyak pengguna bersamaan (di-commit; berbeda dari secrets.toml yang di-gitignore).
[server]
maxUploadSize = 5            # MB; sama dengan batas di validation.MAX_FILE_BYTES
fileWatcherType = "none"     # tidak memantau file sumber di server produksi
runOnSave = false
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"    # pengguna tidak melihat stack trace; detail ada di log server

[runner]
magicEnabled = false
# Streamlit memaksa gc.collect(2) (GC penuh, menahan GIL) setelah SETIAP eksekusi script. Pada uji 100 pengguna ini memakan 59% waktu GIL
# server. GC otomatis Python tetap berjalan; memori puncak uji beban hanya ~200 MB.
postScriptGC = false
